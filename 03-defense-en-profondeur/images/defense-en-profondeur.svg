<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Défense en profondeur : quatre couches de protection autour des données">
  <rect width="640" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="600" height="360" rx="18" fill="#dbe4f3" stroke="#1F3864" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F3864">Couche physique</text>
  <rect x="60" y="65" width="520" height="290" rx="16" fill="#c3d2ea" stroke="#1F3864" stroke-width="2"/>
  <text x="320" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F3864">Couche réseau</text>
  <rect x="100" y="110" width="440" height="230" rx="14" fill="#a9bfe0" stroke="#1F3864" stroke-width="2"/>
  <text x="320" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F3864">Couche système</text>
  <rect x="140" y="155" width="360" height="170" rx="12" fill="#8aa8d3" stroke="#1F3864" stroke-width="2"/>
  <text x="320" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F3864">Couche application</text>
  <rect x="220" y="205" width="200" height="90" rx="10" fill="#1F3864"/>
  <text x="320" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Données</text>
</svg>
